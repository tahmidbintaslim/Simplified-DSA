name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Installs the pnpm version named in package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Browser tests run against the build above in a real Chromium.
      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: node --test "e2e/**/*.test.js"

      # The plugin ships a prebuilt server bundle; fail if it is out of date.
      - name: Check plugin bundle is current
        run: |
          pnpm build:plugin
          git diff --exit-code -- plugin/server
